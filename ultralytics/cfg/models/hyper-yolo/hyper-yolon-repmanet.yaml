# Ultralytics YOLO 🚀, AGPL-3.0 license
# Parameters
nc: 16  # number of classes
backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0-B1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1
  - [-1, 3, RepMANet, [128, True, 2, 3]] # 2-B2/4
  - [-1, 1, Conv, [256, 3, 2]]  # 3
  - [-1, 6, RepMANet, [256, True, 2, 5]] # 4-B3/8
  - [-1, 1, Conv, [512, 3, 2]]  # 5
  - [-1, 6, RepMANet, [512, True, 2, 5]] # 6-B4/16
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 3, RepMANet, [1024, True, 2, 3]] # 8
  - [-1, 1, SPPF, [1024, 5]]  # 9-B5/32

# -------------------------------------------------
# Hyper-YOLO head
# -------------------------------------------------
head:
  # -------------------------------------------------
  # Semantic Collecting

  #   10: AvgPool2d 8x8
  #   11: AvgPool2d 4x4
  #   12: AvgPool2d 2x2
  #



  # -------------------------------------------------

  - [0, 1, nn.AvgPool2d, [8, 8, 0]] # 10
  - [2, 1, nn.AvgPool2d, [4, 4, 0]] # 11
  - [4, 1, nn.AvgPool2d, [2, 2, 0]] # 12
  - [9, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[10, 11, 12, 6, 13], 1, Concat, [1]]  # cat 14


  # -------------------------------------------------
  # Hypergraph Computation
  # -------------------------------------------------
  - [-1, 1, Conv, [512, 1, 1]]               # 15
  - [-1, 1, RFHM, [512]]       # 16
  - [-1, 3, RepMANet, [512, True, 2, 3]]        # 17


  # -------------------------------------------------
  # P5 branch
  # -------------------------------------------------
  - [-1, 1, nn.AvgPool2d, [2, 2, 0]]         # 18 B4/16 -> B5/32
  - [[-1, 9], 1, Concat, [1]]                # 19 concat with backbone B5
  - [-1, 1, Conv, [1024, 1, 1]]              # 20 P5


  # -------------------------------------------------
  # P4 branch
  # -------------------------------------------------
  - [[17, 6], 1, Concat, [1]]                # 21 concat hypergraph feature with B4
  - [-1, 3, RepMANetBaseline, [512, False, 2, 3]]       # 22 P4


  # -------------------------------------------------
  # P3 / N3 branch
  # -------------------------------------------------
  - [17, 1, nn.Upsample, [None, 2, 'nearest']] # 23 B4/16 -> B3/8
  - [[-1, 4], 1, Concat, [1]]                # 24 concat with B3
  - [-1, 3, RepMANet, [256, False, 2, 3]]       # 25 P3 / N3


  # -------------------------------------------------
  # Bottom-up N4 branch
  # -------------------------------------------------
  - [-1, 1, Conv, [256, 3, 2]]               # 26 P3/N3 -> P4 scale
  - [[-1, 22], 1, Concat, [1]]               # 27 concat with P4
  - [-1, 3, RepMANet, [512, False, 2, 3]]       # 28 N4


  # -------------------------------------------------
  # Bottom-up N5 branch
  # -------------------------------------------------
  - [-1, 1, Conv, [512, 3, 2]]               # 29 N4 -> P5 scale
  - [[-1, 20], 1, Concat, [1]]               # 30 concat with P5
  - [-1, 3, C2f, [1024, False]]              # 31 N5


  # -------------------------------------------------
  # Detect
  # -------------------------------------------------
  - [[4, 6, 9, 25, 28, 31], 1, Detect, [nc]]  # Detect(B3, B4, B5, N3, N4, N5)
